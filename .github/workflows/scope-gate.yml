name: Trusted source scope gate
on: [pull_request]
permissions:
  contents: read
jobs:
  scope:
    name: Trusted base scope policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, verified upstream tag
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Preserve checker and policy from trusted base
        run: |
          mkdir "$RUNNER_TEMP/trusted-gate"
          cp ci_scope_gate.py registry.py "$RUNNER_TEMP/trusted-gate/"
          test -f .github/scope-policy.json
          cp .github/scope-policy.json "$RUNNER_TEMP/trusted-gate/policy.json"
      - name: Fetch immutable submission without executing PR code
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git -c core.hooksPath=/dev/null fetch origin "$HEAD_SHA"
      - name: Verify approved assignment and real paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: python "$RUNNER_TEMP/trusted-gate/ci_scope_gate.py" --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --commit "$HEAD_SHA" --policy "$RUNNER_TEMP/trusted-gate/policy.json" --assignment CI-PILOT --repository "$REPOSITORY"
